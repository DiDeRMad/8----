<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SuperGame Lobby</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    #log { height: 300px; overflow-y: scroll; border: 1px solid #ccc; padding: 8px; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>SuperGame Lobby</h1>
  <input id="nickname" placeholder="Enter nickname" />
  <button id="join">Join</button>

  <div id="log"></div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    const logContainer = document.getElementById('log');
    function log(msg) {
      const div = document.createElement('div');
      div.textContent = msg;
      logContainer.appendChild(div);
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    document.getElementById('join').onclick = () => {
      const nicknameInput = document.getElementById('nickname');
      const nickname = nicknameInput.value.trim();
      if (!nickname) {
        alert('Enter nickname');
        return;
      }

      const socket = io('http://localhost:3000');
      socket.emit('join', nickname);

      socket.on('joined', player => {
        log(`You joined as ${player.nickname} (${player.id})`);
        nicknameInput.disabled = true;
      });

      socket.on('player-joined', player => {
        log(`${player.nickname} joined the lobby`);
      });

      socket.on('player-left', id => {
        log(`Player ${id} left`);
      });

      socket.on('disconnect', () => {
        log('Disconnected from server');
      });
    };
  </script>
</body>
</html>
