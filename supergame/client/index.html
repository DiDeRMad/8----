<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>SuperGame Lobby</title>
  <style>
    body { font-family: sans-serif; margin: 2rem; }
    #log { height: 300px; overflow-y: scroll; border: 1px solid #ccc; padding: 8px; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>SuperGame Lobby</h1>
  <input id="nickname" placeholder="Enter nickname" />
  <input id="roomId" placeholder="Room ID (optional)" />
  <button id="createRoom">Create Room</button>
  <button id="joinRoom">Join Room</button>

  <div id="log"></div>
  <div id="chat" style="display:none; margin-top:1rem;">
    <input id="chatMsg" placeholder="Type message" size="40" />
    <button id="sendChat">Send</button>
  </div>
  <div id="game" style="display:none; margin-top:1rem;">
    <p>Select your move:</p>
    <button class="move" data-move="rock">🪨 Rock</button>
    <button class="move" data-move="paper">📄 Paper</button>
    <button class="move" data-move="scissors">✂️ Scissors</button>
  </div>

  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <script>
    const logContainer = document.getElementById('log');
    function log(msg) {
      const div = document.createElement('div');
      div.textContent = msg;
      logContainer.appendChild(div);
      logContainer.scrollTop = logContainer.scrollHeight;
    }

    const socket = io('http://localhost:3000');
    const nicknameInput = document.getElementById('nickname');
    const roomIdInput = document.getElementById('roomId');

    const chatDiv = document.getElementById('chat');
    const chatMsgInput = document.getElementById('chatMsg');

    const gameDiv = document.getElementById('game');
    const moveButtons = Array.from(document.querySelectorAll('.move'));

    document.getElementById('createRoom').onclick = () => {
      const nickname = nicknameInput.value.trim();
      if (!nickname) return alert('Enter nickname');
      socket.emit('create-room', nickname);
    };

    document.getElementById('joinRoom').onclick = () => {
      const nickname = nicknameInput.value.trim();
      const roomId = roomIdInput.value.trim().toUpperCase();
      if (!nickname || !roomId) return alert('Enter nickname and room ID');
      socket.emit('join-room', { roomId, nickname });
    };

    document.getElementById('sendChat').onclick = () => {
      const msg = chatMsgInput.value.trim();
      if (!msg) return;
      socket.emit('chat', msg);
      chatMsgInput.value = '';
    };

    socket.on('room-created', ({ roomId, players }) => {
      log(`Room ${roomId} created. Waiting for players...`);
      afterJoinRoom(players);
      roomIdInput.value = roomId;
    });

    socket.on('room-joined', ({ roomId, players }) => {
      log(`Joined room ${roomId}`);
      afterJoinRoom(players);
    });

    socket.on('player-joined-room', player => {
      log(`${player.nickname} joined room`);
    });

    socket.on('player-left-room', id => {
      log(`Player ${id} left room`);
    });

    socket.on('chat', ({ player, message }) => {
      log(`${player.nickname}: ${message}`);
    });

    socket.on('error', msg => {
      log(`Error: ${msg}`);
    });

    moveButtons.forEach(btn => {
      btn.onclick = () => {
        const move = btn.dataset.move;
        socket.emit('move', move);
        disableMoves();
        log(`You chose ${move}`);
      };
    });

    function enableMoves() {
      moveButtons.forEach(b => b.disabled = false);
    }
    function disableMoves() {
      moveButtons.forEach(b => b.disabled = true);
    }

    socket.on('game-start', () => {
      log('Game started!');
      gameDiv.style.display = 'block';
      enableMoves();
    });

    socket.on('game-stop', () => {
      log('Waiting for another player...');
      disableMoves();
      gameDiv.style.display = 'none';
    });

    socket.on('round-result', ({ moves, winnerId }) => {
      const entries = Object.entries(moves).map(([id, mv]) => `${id === socket.id ? 'You' : id} chose ${mv}`);
      log(entries.join(' | '));
      if (winnerId === null) {
        log('Round result: Draw');
      } else if (winnerId === socket.id) {
        log('Round result: You win!');
      } else {
        log('Round result: You lose.');
      }
      enableMoves();
    });

    function afterJoinRoom(players) {
      nicknameInput.disabled = true;
      roomIdInput.disabled = true;
      chatDiv.style.display = 'block';
      log('Players in room: ' + players.map(p => p.nickname).join(', '));
    }
  </script>
</body>
</html>
